
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Customer Management</h2>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>

<!-- Add Customer Form -->
<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0">Add New Customer</h5>
    </div>

    <div class="card-body">
        <form id="customerForm">

            <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input type="text" id="customerName"
                    class="form-control"
                    placeholder="Enter customer name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" id="customerPhone"
                    class="form-control"
                    placeholder="Enter phone number">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="customerEmail"
                    class="form-control"
                    placeholder="Enter email address">
            </div>

            <button type="submit" class="btn btn-primary">
                Add Customer
            </button>

        </form>

        <div id="customerMessage" class="mt-3"></div>
    </div>
</div>


<!-- Search Customers -->
<div class="card mb-4">
    <div class="card-body">

        <h5>Search Customers</h5>

        <div class="input-group">
            <input type="text" id="customerSearch"
                class="form-control"
                placeholder="Search by name or phone">

            <button class="btn btn-primary"
                onclick="searchCustomers()">
                Search
            </button>

            <button class="btn btn-secondary"
                onclick="loadCustomers()">
                Show All
            </button>
        </div>

    </div>
</div>


<!-- Customer List -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Customer List</h5>
    </div>

    <div class="card-body">

        <div class="table-responsive">
            <table class="table table-bordered table-striped">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="customerTable">
                </tbody>

            </table>
        </div>

        <div id="customerTableMessage"></div>

    </div>
</div>


<!-- Edit Customer Modal -->
<div class="modal fade" id="editCustomerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Customer Details</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editCustomerId">

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" id="editCustomerName"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="editCustomerPhone"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="editCustomerEmail"
                        class="form-control">
                </div>

                <div id="editCustomerMessage"></div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cancel</button>

                <button type="button" class="btn btn-primary"
                    onclick="updateCustomer()">Update Customer</button>
            </div>

        </div>
    </div>
</div>


{% endblock %}
