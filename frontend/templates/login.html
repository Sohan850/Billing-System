

{% extends "base.html" %}

{% block content %}

<style>
/* =============================================
   LOGIN PAGE - PREMIUM ANIMATED DARK THEME
============================================= */

/* Main page background */
html:has(.login-card),
body:has(.login-card) {
    background: #101126 !important;
    min-height: 100%;
}

body:has(.login-card),
body:has(.login-card) main,
body:has(.login-card) .container-fluid,
body:has(.login-card) .main-content,
body:has(.login-card) .content-area,
body:has(.login-card) .content-wrapper {
    background: #101126 !important;
    color: #f4f5ff !important;
}

/* =============================================
   ANIMATED PAGE CONTAINER
============================================= */

.login-page {
    position: relative;
    isolation: isolate;
    min-height: calc(100vh - 40px);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px 16px;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 15% 15%,
            rgba(102, 94, 232, .15),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 85% 85%,
            rgba(163, 92, 221, .13),
            transparent 42%
        ),
        #101126;
}

/* Animated purple glow */
.login-page::before {
    content: "";
    position: absolute;
    z-index: -1;
    width: 320px;
    height: 320px;
    top: 5%;
    left: 5%;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(112, 91, 235, .22),
        transparent 70%
    );
    filter: blur(35px);
    animation: loginGlowOne 8s ease-in-out infinite alternate;
    pointer-events: none;
}

/* Animated blue glow */
.login-page::after {
    content: "";
    position: absolute;
    z-index: -1;
    width: 360px;
    height: 360px;
    bottom: 0;
    right: 3%;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(63, 140, 219, .17),
        transparent 70%
    );
    filter: blur(40px);
    animation: loginGlowTwo 10s ease-in-out infinite alternate;
    pointer-events: none;
}

.login-page > .row {
    position: relative;
    z-index: 1;
    width: 100%;
    margin: 0;
    justify-content: center;
}

/* =============================================
   LOGIN CARD
============================================= */

.login-card {
    position: relative;
    width: 100%;
    background: rgba(26, 28, 58, .96) !important;
    color: #f4f5ff !important;
    border: 1px solid rgba(169, 154, 255, .23) !important;
    border-radius: 20px !important;
    overflow: hidden;
    backdrop-filter: blur(15px);
    box-shadow:
        0 20px 70px rgba(0, 0, 0, .4),
        0 0 35px rgba(120, 101, 235, .09);
    animation: loginCardEnter .85s cubic-bezier(.2, .8, .2, 1) both;
    transition: transform .3s ease, box-shadow .3s ease;
}

/* Gradient line at the top */
.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(
        90deg,
        #665ee8,
        #b65de0,
        #35b9dc,
        #665ee8
    );
    background-size: 200% 100%;
    animation: loginGradient 5s linear infinite;
}

/* Card hover */
.login-card:hover {
    transform: translateY(-4px);
    box-shadow:
        0 25px 80px rgba(0, 0, 0, .45),
        0 0 40px rgba(120, 101, 235, .15);
}

.login-card .card-body {
    background: transparent !important;
    color: #f4f5ff !important;
    padding: 38px !important;
}

/* =============================================
   BRAND LOGO
============================================= */

.login-brand-mark {
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;

    background: linear-gradient(
        135deg,
        #6275f4,
        #785fe6
    ) !important;

    color: #ffffff !important;
    font-size: 35px;
    font-weight: 800;
    letter-spacing: -1px;

    box-shadow:
        0 10px 30px rgba(102, 105, 235, .32),
        inset 0 1px 2px rgba(255, 255, 255, .25);

    animation: brandFloat 4s ease-in-out infinite;
}

/* =============================================
   LOGIN HEADING
============================================= */

.login-card h3 {
    color: #f5f3ff !important;
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: -.7px;
    margin-top: 5px;
}

.login-card .text-center p {
    color: #a8b0d2 !important;
    font-size: .95rem;
}

/* =============================================
   FORM LABELS
============================================= */

.login-card .form-label {
    display: block;
    color: #c7c9e9 !important;
    font-size: .9rem;
    font-weight: 650;
    margin-bottom: 9px;
}

/* =============================================
   INPUT FIELDS
============================================= */

.login-card .form-control {
    width: 100%;
    min-height: 49px;

    background: #12152e !important;
    color: #f5f5ff !important;

    border: 1px solid #343858 !important;
    border-radius: 11px !important;

    padding: 12px 15px;
    font-size: .93rem;
    font-family: inherit;

    box-shadow: none !important;
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.login-card .form-control::placeholder {
    color: #858eaf !important;
    opacity: 1;
}

.login-card .form-control:hover {
    border-color: #565b88 !important;
}

.login-card .form-control:focus {
    background: #171a38 !important;
    color: #ffffff !important;
    border-color: #8974f5 !important;
    box-shadow: 0 0 0 4px rgba(137, 116, 245, .17) !important;
    outline: none;
}

/* =============================================
   LOGIN BUTTON
============================================= */

.login-card .btn-primary {
    position: relative;
    overflow: hidden;
    min-height: 49px;

    background: linear-gradient(
        120deg,
        #665ee8,
        #935de0,
        #a85cda
    ) !important;

    background-size: 200% 100%;

    color: #ffffff !important;
    border: none !important;
    border-radius: 11px !important;

    font-size: 1rem;
    font-weight: 750 !important;
    letter-spacing: .3px;

    box-shadow: 0 7px 20px rgba(126, 94, 232, .25);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background-position .4s ease;
}

/* Button shine animation */
.login-card .btn-primary::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;

    background: linear-gradient(
        110deg,
        transparent,
        rgba(255, 255, 255, .23),
        transparent
    );

    transform: skewX(-20deg);
    transition: left .6s ease;
}

.login-card .btn-primary:hover {
    background-position: 100% 0;
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(126, 94, 232, .38);
}

.login-card .btn-primary:hover::before {
    left: 150%;
}

.login-card .btn-primary:active {
    transform: translateY(0) scale(.985);
}

/* =============================================
   LOGIN FEEDBACK
============================================= */

#loginMessage {
    color: #c7c9e9 !important;
    font-size: .88rem;
    line-height: 1.5;
}

#loginMessage .alert {
    border-radius: 10px;
    padding: 12px 14px;
}

#loginMessage .alert-success {
    background: #173c37 !important;
    color: #a8f0d3 !important;
    border: 1px solid #276c5d !important;
}

#loginMessage .alert-danger {
    background: #472531 !important;
    color: #ffc1cd !important;
    border: 1px solid #874254 !important;
}

/* =============================================
   FOOTER TEXT
============================================= */

.login-card .text-muted {
    color: #858eaf !important;
    font-size: .79rem;
    letter-spacing: .15px;
}

/* =============================================
   KEYFRAME ANIMATIONS
============================================= */

/* Card entrance */
@keyframes loginCardEnter {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Floating logo */
@keyframes brandFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* Purple glow movement */
@keyframes loginGlowOne {
    from {
        transform: translate(0, 0) scale(1);
        opacity: .65;
    }

    to {
        transform: translate(90px, 55px) scale(1.25);
        opacity: 1;
    }
}

/* Blue glow movement */
@keyframes loginGlowTwo {
    from {
        transform: translate(0, 0) scale(1);
        opacity: .5;
    }

    to {
        transform: translate(-80px, -55px) scale(1.3);
        opacity: .9;
    }
}

/* Moving gradient */
@keyframes loginGradient {
    from {
        background-position: 0% 50%;
    }

    to {
        background-position: 200% 50%;
    }
}

/* =============================================
   RESPONSIVE DESIGN
============================================= */

@media (max-width: 576px) {
    .login-page {
        min-height: calc(100vh - 20px);
        padding: 24px 12px;
    }

    .login-card .card-body {
        padding: 27px 22px !important;
    }

    .login-brand-mark {
        width: 66px;
        height: 66px;
        font-size: 30px;
        border-radius: 19px;
    }

    .login-card h3 {
        font-size: 1.4rem;
    }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    .login-card,
    .login-brand-mark,
    .login-page::before,
    .login-page::after,
    .login-card::before {
        animation: none !important;
        transition: none !important;
    }
}

/* FIX LOGIN CARD WIDTH AND ALIGNMENT */

.login-page {
    width: 100% !important;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px 20px;
}

.login-shell {
    width: 100%;
    max-width: 430px;
    min-width: 0;
    margin: 0 auto;
}

.login-card {
    width: 100% !important;
    min-width: 0 !important;
    max-width: 430px;
    margin: 0 auto;
}

.login-card .card-body {
    width: 100%;
    min-width: 0;
}

.login-card h3 {
    white-space: normal;
    overflow-wrap: normal;
    word-break: normal;
    font-size: 1.65rem;
}

.login-card p,
.login-card small {
    word-break: normal;
    overflow-wrap: normal;
}

/* Mobile responsiveness */
@media (max-width: 576px) {
    .login-page {
        padding: 20px 14px;
    }

    .login-shell {
        max-width: 100%;
    }

    .login-card .card-body {
        padding: 27px 22px !important;
    }
}

/* REMOVE THE EXTRA RECTANGULAR BACKGROUND LAYER */

.login-page {
    background: #101126 !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
}

/* Remove background glow layers causing visible edges */
.login-page::before,
.login-page::after {
    display: none !important;
    content: none !important;
}

/* Make surrounding layout containers transparent */
body:has(.login-card) .container,
body:has(.login-card) .container-fluid,
body:has(.login-card) main,
body:has(.login-card) .main-content,
body:has(.login-card) .content-area,
body:has(.login-card) .content-wrapper {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

/* Keep the login card's premium shadow */
.login-card {
    box-shadow:
        0 20px 60px rgba(0, 0, 0, .35),
        0 0 30px rgba(120, 101, 235, .10) !important;
}

</style>



<div class="login-page">

    <div class="login-shell">

        <div class="card login-card">

            <div class="card-body p-4">

                <!-- Logo and Heading -->
                <div class="text-center mb-4">

                    <div class="login-brand-mark mx-auto mb-3">
                        B
                    </div>

                    <h3 class="mb-2">
                        Billing & Inventory
                    </h3>

                    <p class="mb-0">
                        Management System
                    </p>

                </div>

                <!-- Login Form -->
                <form id="loginForm">

                    <div class="mb-3">
                        <label class="form-label" for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2"
                    >
                        Login
                    </button>

                </form>

                <!-- Login Feedback -->
                <div id="loginMessage" class="mt-3"></div>

                <div class="text-center mt-4">
                    <small class="text-muted">
                        Secure access to your business management system
                    </small>
                </div>

            </div>

        </div>

    </div>

</div>



{% endblock %}
