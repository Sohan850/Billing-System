
{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5 col-lg-4">

        <div class="card login-card">

            <div class="card-body p-4">

                <!-- Logo and Heading -->
                <div class="text-center mb-4">

                    <div class="login-brand-mark mx-auto mb-3">
                        B
                    </div>

                    <h3 class="mb-2">
                        Billing & Inventory
                    </h3>

                    <p class="mb-0">
                        Management System
                    </p>

                </div>


                <!-- Login Form -->
                <form id="loginForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2"
                    >
                        Login
                    </button>

                </form>


                <!-- Login Feedback -->
                <div id="loginMessage" class="mt-3"></div>


                <div class="text-center mt-4">
                    <small class="text-muted">
                        Secure access to your business management system
                    </small>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
