
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Product Management</h2>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>

<!-- Add Product Form -->
<div class="card mb-4">
    <div class="card-header">
        Add New Product
    </div>

    <div class="card-body">

        <form id="productForm">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Product Name</label>
                    <input type="text" id="productName" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">SKU</label>
                    <input type="text" id="sku" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Cost Price</label>
                    <input type="number" id="costPrice" class="form-control" min="0" step="0.01" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Selling Price</label>
                    <input type="number" id="sellingPrice" class="form-control" min="0" step="0.01" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" id="stockQuantity" class="form-control" min="0" step="1" required>
                </div>

            </div>

            <button type="submit" class="btn btn-success mt-3">
                Add Product
            </button>

        </form>

        <div id="productMessage" class="mt-3"></div>

    </div>
</div>


<!-- Search Products -->
<div class="card mb-4">

    <div class="card-header">
        Search Products
    </div>

    <div class="card-body">

        <div class="input-group">
            <input type="text" id="searchKeyword" class="form-control" placeholder="Enter product name or SKU">

            <button class="btn btn-primary" onclick="searchProducts()">
                Search
            </button>

            <button class="btn btn-secondary" onclick="loadProducts()">
                Show All
            </button>
        </div>

    </div>
</div>


<!-- Product List -->
<div class="card">

    <div class="card-header">
        Product List
    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>SKU</th>
                        <th>Cost Price</th>
                        <th>Selling Price</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="productTable">
                </tbody>

            </table>

        </div>

        <div id="tableMessage"></div>

    </div>
</div>

{% endblock %}
