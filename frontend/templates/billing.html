
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Billing Management</h2>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>

<!-- Customer Selection -->
<div class="card mb-4">
    <div class="card-header">Create New Bill</div>
    <div class="card-body">

        <div class="mb-3">
            <label class="form-label">Customer ID (Optional)</label>
            <input type="number" id="customerId" class="form-control"
                   placeholder="Enter customer ID">
        </div>

        <!-- Product Selection -->
        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Product</label>
                <select id="productSelect" class="form-select">
                    <option value="">Select Product</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Quantity</label>
                <input type="number" id="billQuantity"
                       class="form-control" min="1" value="1">
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <button type="button" class="btn btn-primary w-100"
                        onclick="addBillItem()">
                    Add to Bill
                </button>
            </div>

        </div>

    </div>
</div>

<!-- Bill Items -->
<div class="card mb-4">
    <div class="card-header">Bill Items</div>

    <div class="card-body">

        <div class="table-responsive">
            <table class="table table-bordered">

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="billTable"></tbody>

            </table>
        </div>

        <h5 class="text-end">
            Total: ₹<span id="billTotal">0.00</span>
        </h5>

        <button class="btn btn-success" onclick="createBill()">
            Generate Bill
        </button>

        <div id="billMessage" class="mt-3"></div>

    </div>
</div>

{% endblock %}
