
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Membership Management</h2>
    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>
</div>

<!-- Add Membership -->
<div class="card mb-4">

    <div class="card-header">
        <h5 class="mb-0">Register Membership</h5>
    </div>

    <div class="card-body">

        <form id="membershipForm">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer ID</label>
                    <input type="number" id="membershipCustomerId"
                        class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Membership Type</label>
                    <select id="membershipType" class="form-select" required>
                        <option value="">Select Membership</option>
                        <option value="Gold">Gold</option>
                        <option value="Silver">Silver</option>
                        <option value="Platinum">Platinum</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" id="membershipStartDate"
                        class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" id="membershipEndDate"
                        class="form-control">
                </div>

            </div>

            <button type="submit" class="btn btn-primary">
                Register Membership
            </button>

        </form>

        <div id="membershipMessage" class="mt-3"></div>

    </div>
</div>

<!-- Membership History -->
<div class="card">

    <div class="card-header">
        <h5 class="mb-0">Membership Records</h5>
    </div>

    <div class="card-body">

        <div class="table-responsive">
            <table class="table table-bordered table-striped">

                <thead>
                    <tr>
                        <th>Membership ID</th>
                        <th>Customer ID</th>
                        <th>Membership Type</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="membershipTable"></tbody>

            </table>
        </div>

        <div id="membershipTableMessage"></div>

    </div>
</div>


<!-- Edit Membership Modal -->
<div class="modal fade" id="editMembershipModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Membership</h5>
                <button type="button" class="btn-close"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="editMembershipId">

                <div class="mb-3">
                    <label class="form-label">Membership Type</label>
                    <select id="editMembershipType" class="form-select">
                        <option value="Gold">Gold</option>
                        <option value="Silver">Silver</option>
                        <option value="Platinum">Platinum</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" id="editMembershipStartDate"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" id="editMembershipEndDate"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select id="editMembershipStatus" class="form-select">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>

                <div id="editMembershipMessage"></div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button" class="btn btn-primary"
                    onclick="updateMembership()">
                    Update Membership
                </button>
            </div>

        </div>
    </div>
</div>


{% endblock %}
