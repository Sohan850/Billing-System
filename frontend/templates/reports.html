
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Reports Management</h2>

    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>
</div>

<!-- Daily Sales Report -->
<div class="card mb-4">

    <div class="card-header">
        <h5 class="mb-0">Daily Sales Report</h5>
    </div>

    <div class="card-body">

        <div class="row align-items-end">

            <div class="col-md-4 mb-3">
                <label class="form-label">Select Date</label>
                <input type="date" id="dailyReportDate"
                    class="form-control">
            </div>

            <div class="col-md-3 mb-3">
                <button class="btn btn-primary"
                    onclick="loadDailyReport()">
                    Generate Daily Report
                </button>
            </div>

        </div>

        <div id="dailyReportResult"></div>

    </div>
</div>

<!-- Monthly Sales Report -->
<div class="card mb-4">

    <div class="card-header">
        <h5 class="mb-0">Monthly Sales Report</h5>
    </div>

    <div class="card-body">

        <div class="row align-items-end">

            <div class="col-md-4 mb-3">
                <label class="form-label">Select Month</label>
                <input type="month" id="monthlyReportDate"
                    class="form-control">
            </div>

            <div class="col-md-3 mb-3">
                <button class="btn btn-primary"
                    onclick="loadMonthlyReport()">
                    Generate Monthly Report
                </button>
            </div>

        </div>

        <div id="monthlyReportResult"></div>

    </div>
</div>

<!-- Top Selling Products -->
<div class="card mb-4">

    <div class="card-header">
        <h5 class="mb-0">Top-Selling Products</h5>
    </div>

    <div class="card-body">

        <div class="row align-items-end">

            <div class="col-md-4 mb-3">
                <label class="form-label">Number of Products</label>
                <input type="number" id="topProductLimit"
                    class="form-control" value="5" min="1">
            </div>

            <div class="col-md-3 mb-3">
                <button class="btn btn-primary"
                    onclick="loadTopProducts()">
                    Show Top Products
                </button>
            </div>

        </div>

        <div id="topProductsResult"></div>

    </div>
</div>

{% endblock %}
